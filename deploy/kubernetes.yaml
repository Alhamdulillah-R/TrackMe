apiVersion: v1
kind: ConfigMap
metadata:
  name: trackme-config
  namespace: mignon-tokyo
data:
  config.json: |
    {
      "log_to_db": false,
      "tls_port": "443",
      "http_port": "18082",
      "cert_file": "/etc/mignon-tokyo/tls/fullchain.crt",
      "key_file": "/etc/mignon-tokyo/tls/private.pem",
      "host": "46.250.253.244",
      "http_redirect": "https://mignon-rex.tokyo",
      "device": "",
      "cors_key": "",
      "enable_quic": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackme
  namespace: mignon-tokyo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trackme
  template:
    metadata:
      labels:
        app: trackme
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: k3s-master
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trackme
          image: rex-tokyo-serv.tail3078d0.ts.net:8443/mignon/trackme@sha256:5a711ff1cd041997c042ea2ca57c5c993edd014eaad59f903587d3de4dedc863
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
            - name: quic
              containerPort: 443
              protocol: UDP
            - name: redirect
              containerPort: 18082
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: https
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 15
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsUser: 65532
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: tls
              mountPath: /etc/mignon-tokyo/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: trackme-config
            defaultMode: 0444
        - name: tls
          hostPath:
            path: /etc/mignon-tokyo/tls
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: trackme
  namespace: mignon-tokyo
spec:
  selector:
    app: trackme
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: quic
      port: 443
      targetPort: quic
      protocol: UDP
