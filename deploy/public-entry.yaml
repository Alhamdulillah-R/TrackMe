apiVersion: v1
kind: ConfigMap
metadata:
  name: mignon-tokyo-public-nginx
  namespace: mignon-tokyo
data:
  default.conf: |
    server {
        listen 46.250.253.244:80;
        listen [2400:d320:2347:252::1]:80;
        server_name mignon-rex.tokyo;
        return 301 https://mignon-rex.tokyo$request_uri;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mignon-tokyo-public-entry
  namespace: mignon-tokyo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mignon-tokyo-public-entry
  template:
    metadata:
      labels:
        app: mignon-tokyo-public-entry
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: k3s-master
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/library/nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
          readinessProbe:
            httpGet:
              host: 46.250.253.244
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: mignon-rex.tokyo
            periodSeconds: 5
          livenessProbe:
            httpGet:
              host: 46.250.253.244
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: mignon-rex.tokyo
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 150m
              memory: 64Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mignon-tokyo-public-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
