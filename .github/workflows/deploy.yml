name: Verify, build and deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trackme-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, tokyo, tokyo-test]
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify checkout and source tree
        shell: bash
        run: |
          test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
          /usr/bin/git diff-tree --check "$GITHUB_SHA^" "$GITHUB_SHA"
          test -f go.mod
          test -f Dockerfile
          test -f .mignon-ci.yaml

  build:
    name: Build and push
    if: github.ref == 'refs/heads/master'
    needs: [verify]
    environment:
      name: production
    runs-on: [self-hosted, linux, x64, tokyo, tokyo-build, docker-builder]
    timeout-minutes: 50
    outputs:
      image_digest: ${{ steps.build.outputs.image_digest }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify checkout
        shell: bash
        run: test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build and push
        id: build
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          build_log="$(/usr/bin/mktemp)"
          trap '/usr/bin/rm -f "$build_log"' EXIT
          /usr/local/bin/mignon-build-push --config .mignon-ci.yaml --revision "$GITHUB_SHA" | /usr/bin/tee "$build_log"
          mapfile -t image_refs < <(/usr/bin/sed -n "s/^IMAGE_REF=//p" "$build_log")
          test "${#image_refs[@]}" -eq 1
          image_ref="${image_refs[0]}"
          image_pattern='^rex-tokyo-serv\.tail3078d0\.ts\.net:8443/mignon/trackme@sha256:[0-9a-f]{64}$'
          [[ "$image_ref" =~ $image_pattern ]]
          image_digest="${image_ref##*@}"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf "image_digest=%s\n" "$image_digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master'
    needs: [build]
    runs-on: [self-hosted, linux, x64, tokyo, tokyo-deploy, k8s-deployer]
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify checkout
        shell: bash
        run: test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Deploy
        shell: bash
        env:
          IMAGE_REF: rex-tokyo-serv.tail3078d0.ts.net:8443/mignon/trackme@${{ needs.build.outputs.image_digest }}
          KUBECONFIG: /etc/mignon-ci/kubeconfigs/Alhamdulillah-R__TrackMe.yaml
        run: /usr/local/bin/mignon-deploy --config .mignon-ci.yaml --image-ref "$IMAGE_REF"
